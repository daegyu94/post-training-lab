global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: node
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/nodes.json
        refresh_interval: 30s

  - job_name: gpu
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/gpus.json
        refresh_interval: 30s

  - job_name: application
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/applications.json
        refresh_interval: 30s

  - job_name: storage-smart
    scrape_interval: 60s
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/storage.json
        refresh_interval: 30s
