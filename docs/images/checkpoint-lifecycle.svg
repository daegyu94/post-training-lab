<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
<title id="title">Candidate and serving lifecycle</title>
<desc id="desc">Artifact registration and production traffic are separate state changes.. Rollback: restore traffic and alias to the previous serving revision, including its configuration.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#52627a" stroke-width="1.5"/></marker></defs>
<rect width="1200" height="460" rx="20" fill="#f4f7fb"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="36" y="47" font-size="27" font-weight="700" fill="#15283f">Candidate and serving lifecycle</text>
<text x="36" y="77" font-size="16" fill="#52627a">Artifact registration and production traffic are separate state changes.</text>
<rect x="36.0" y="112" width="354.6666666666667" height="250" rx="14" fill="white" stroke="#d7e0ec"/>
<rect x="36.0" y="112" width="354.6666666666667" height="6" rx="3" fill="#2563eb"/>
<text x="56.0" y="150" font-size="13" font-weight="700" fill="#2563eb">01 / ARTIFACT</text>
<text x="56.0" y="186" font-size="21" font-weight="700" fill="#15283f">Publish candidate</text>
<text x="56.0" y="222" font-size="16" fill="#40536b">Generated files in staging</text>
<text x="56.0" y="250" font-size="16" fill="#40536b">Verify inventory and digests</text>
<text x="56.0" y="278" font-size="16" fill="#40536b">Register immutable revision</text>
<path d="M393.6666666666667 248 H417.6666666666667" fill="none" stroke="#52627a" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="422.6666666666667" y="112" width="354.6666666666667" height="250" rx="14" fill="white" stroke="#d7e0ec"/>
<rect x="422.6666666666667" y="112" width="354.6666666666667" height="6" rx="3" fill="#087e8b"/>
<text x="442.6666666666667" y="150" font-size="13" font-weight="700" fill="#087e8b">02 / EVIDENCE</text>
<text x="442.6666666666667" y="186" font-size="21" font-weight="700" fill="#15283f">Approve candidate</text>
<text x="442.6666666666667" y="222" font-size="16" fill="#40536b">Load + offline evaluation</text>
<text x="442.6666666666667" y="250" font-size="16" fill="#40536b">Safety + runtime checks</text>
<text x="442.6666666666667" y="278" font-size="16" fill="#40536b">Reject failures with evidence</text>
<path d="M780.3333333333334 248 H804.3333333333334" fill="none" stroke="#52627a" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="809.3333333333334" y="112" width="354.6666666666667" height="250" rx="14" fill="white" stroke="#d7e0ec"/>
<rect x="809.3333333333334" y="112" width="354.6666666666667" height="6" rx="3" fill="#7952b3"/>
<text x="829.3333333333334" y="150" font-size="13" font-weight="700" fill="#7952b3">03 / TRAFFIC</text>
<text x="829.3333333333334" y="186" font-size="21" font-weight="700" fill="#15283f">Release revision</text>
<text x="829.3333333333334" y="222" font-size="16" fill="#40536b">Approved candidate → canary</text>
<text x="829.3333333333334" y="250" font-size="16" fill="#40536b">Healthy canary → production</text>
<text x="829.3333333333334" y="278" font-size="16" fill="#40536b">Regression → quarantine</text>
<text x="36" y="409" font-size="16" fill="#40536b">Rollback: restore traffic and alias to the previous serving revision, including its configuration.</text>
</g></svg>
