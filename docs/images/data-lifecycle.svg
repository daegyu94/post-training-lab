<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
<title id="title">Data access and publication</title>
<desc id="desc">Access is granted separately at each boundary.. Rejected records stay outside training input; test labels and graders stay outside training access.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#52627a" stroke-width="1.5"/></marker></defs>
<rect width="1200" height="460" rx="20" fill="#f4f7fb"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="36" y="47" font-size="27" font-weight="700" fill="#15283f">Data access and publication</text>
<text x="36" y="77" font-size="16" fill="#52627a">Access is granted separately at each boundary.</text>
<rect x="36.0" y="112" width="354.6666666666667" height="250" rx="14" fill="white" stroke="#d7e0ec"/>
<rect x="36.0" y="112" width="354.6666666666667" height="6" rx="3" fill="#2563eb"/>
<text x="56.0" y="150" font-size="13" font-weight="700" fill="#2563eb">01 / RESTRICTED</text>
<text x="56.0" y="186" font-size="21" font-weight="700" fill="#15283f">Restricted sources</text>
<text x="56.0" y="222" font-size="16" fill="#40536b">Allowed events + benchmarks</text>
<text x="56.0" y="250" font-size="16" fill="#40536b">Reconstruct and redact</text>
<text x="56.0" y="278" font-size="16" fill="#40536b">Review targets and policy</text>
<path d="M393.6666666666667 248 H417.6666666666667" fill="none" stroke="#52627a" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="422.6666666666667" y="112" width="354.6666666666667" height="250" rx="14" fill="white" stroke="#d7e0ec"/>
<rect x="422.6666666666667" y="112" width="354.6666666666667" height="6" rx="3" fill="#087e8b"/>
<text x="442.6666666666667" y="150" font-size="13" font-weight="700" fill="#087e8b">02 / CURATION</text>
<text x="442.6666666666667" y="186" font-size="21" font-weight="700" fill="#15283f">Reviewed records</text>
<text x="442.6666666666667" y="222" font-size="16" fill="#40536b">Canonical records</text>
<text x="442.6666666666667" y="250" font-size="16" fill="#40536b">Deduplicate and group splits</text>
<text x="442.6666666666667" y="278" font-size="16" fill="#40536b">Keep rejects access-controlled</text>
<path d="M780.3333333333334 248 H804.3333333333334" fill="none" stroke="#52627a" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="809.3333333333334" y="112" width="354.6666666666667" height="250" rx="14" fill="white" stroke="#d7e0ec"/>
<rect x="809.3333333333334" y="112" width="354.6666666666667" height="6" rx="3" fill="#7952b3"/>
<text x="829.3333333333334" y="150" font-size="13" font-weight="700" fill="#7952b3">03 / IMMUTABLE</text>
<text x="829.3333333333334" y="186" font-size="21" font-weight="700" fill="#15283f">Published dataset</text>
<text x="829.3333333333334" y="222" font-size="16" fill="#40536b">Records + split + manifest</text>
<text x="829.3333333333334" y="250" font-size="16" fill="#40536b">Validate counts and digest</text>
<text x="829.3333333333334" y="278" font-size="16" fill="#40536b">Version backend derivatives</text>
<text x="36" y="409" font-size="16" fill="#40536b">Rejected records stay outside training input; test labels and graders stay outside training access.</text>
</g></svg>
