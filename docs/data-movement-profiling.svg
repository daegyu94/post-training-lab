<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc">
<title id="title">Data movement: locate the path, then choose evidence</title><desc id="desc">Conceptual paths, not a fixed hardware topology. Available links and counters must be checked on the allocation.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#47647d"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#20354b}.title{font-size:27px;font-weight:700}.heading{font-size:19px;font-weight:700}.body{font-size:16px}.small{font-size:14px}</style>
<rect width="1200" height="100%" fill="#ffffff"/>
<text x="36" y="44" class="title">Data movement: locate the path, then choose evidence</text>
<text x="36" y="74" class="small">Conceptual paths, not a fixed hardware topology. Available links and counters must be checked on the allocation.</text>
<rect x="36" y="112" width="210" height="135" rx="12" fill="#eef4fb" stroke="#8194a8" stroke-width="1.5"/>
<text x="56" y="144" class="heading">Storage</text>
<text x="56" y="175" class="body">Local disk or shared NFS</text>
<text x="56" y="200" class="body">Dataset / checkpoint files</text>
<rect x="342" y="112" width="210" height="135" rx="12" fill="#eef4fb" stroke="#8194a8" stroke-width="1.5"/>
<text x="362" y="144" class="heading">Host memory</text>
<text x="362" y="175" class="body">Staging / preprocessing</text>
<text x="362" y="200" class="body">Serialization / input</text>
<rect x="648" y="112" width="210" height="135" rx="12" fill="#eef4fb" stroke="#8194a8" stroke-width="1.5"/>
<text x="668" y="144" class="heading">Local GPU</text>
<text x="668" y="175" class="body">Compute / device copies</text>
<text x="668" y="200" class="body">Rank-to-device mapping</text>
<rect x="954" y="112" width="210" height="135" rx="12" fill="#eef4fb" stroke="#8194a8" stroke-width="1.5"/>
<text x="974" y="144" class="heading">Peer GPU</text>
<text x="974" y="175" class="body">Same or remote node</text>
<text x="974" y="200" class="body">Collective / weight sync</text>
<path d="M246 176 H342" fill="none" stroke="#47647d" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M552 176 H648" fill="none" stroke="#47647d" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M858 176 H954" fill="none" stroke="#47647d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="264" y="155" class="small">I/O</text>
<text x="563" y="155" class="small">H2D</text>
<text x="869" y="155" class="small">transfer</text>
<text x="36" y="280" class="small">Reads and H2D shown above; checkpoint staging and writes can flow in the reverse direction.</text>
<text x="55" y="329" class="heading">Path / phase</text>
<text x="358" y="329" class="heading">First evidence</text>
<text x="757" y="329" class="heading">Next measurement / boundary</text>
<rect x="36" y="350" width="1128" height="92" rx="8" fill="#eef4fb"/>
<text x="55" y="380" class="body">Storage &lt;-&gt; host</text>
<text x="55" y="409" class="small">loading / checkpoint</text>
<text x="358" y="380" class="small">Disk / NIC counters + framework I/O timer</text>
<text x="757" y="380" class="small">fio on the same path and cache conditions</text>
<text x="757" y="409" class="small">NFS also needs client and server evidence.</text>
<rect x="36" y="449" width="1128" height="92" rx="8" fill="#f5f7f9"/>
<text x="55" y="479" class="body">Host &lt;-&gt; GPU</text>
<text x="55" y="508" class="small">input / restore / save</text>
<text x="358" y="479" class="small">Data wait + selected copy events</text>
<text x="757" y="479" class="small">Measure copy bytes and elapsed time</text>
<text x="757" y="508" class="small">Host/GPU utilization is not copy bandwidth.</text>
<rect x="36" y="548" width="1128" height="92" rx="8" fill="#eef4fb"/>
<text x="55" y="578" class="body">GPU &lt;-&gt; GPU: local</text>
<text x="55" y="607" class="small">forward_backward / optimizer</text>
<text x="358" y="578" class="small">Framework collective timer + GPU counters</text>
<text x="757" y="578" class="small">Single-node NCCL baseline + selected trace</text>
<text x="757" y="607" class="small">Do not assume NVLink or NVSwitch exists.</text>
<rect x="36" y="647" width="1128" height="92" rx="8" fill="#f5f7f9"/>
<text x="55" y="677" class="body">GPU &lt;-&gt; GPU: remote</text>
<text x="55" y="706" class="small">collective / weight_sync</text>
<text x="358" y="677" class="small">NIC counters + communication timer</text>
<text x="757" y="677" class="small">Multi-node NCCL baseline + rank traces</text>
<text x="757" y="706" class="small">Do not infer RDMA from NIC traffic alone.</text>
<text x="36" y="778" class="body">Phase markers correlate time windows; they do not attribute every observed byte to a rank or operation.</text>
<text x="36" y="808" class="small">Effective bandwidth = measured path bytes / measured duration. Contract entries require adapters; they are not auto-collected.</text>
</svg>
