<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
<title id="title">System boundaries</title>
<desc id="desc">Serving remains available when training or release services are unavailable.. Observability links all planes through request, run, candidate and serving identities.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#52627a" stroke-width="1.5"/></marker></defs>
<rect width="1200" height="460" rx="20" fill="#f4f7fb"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="36" y="47" font-size="27" font-weight="700" fill="#15283f">System boundaries</text>
<text x="36" y="77" font-size="16" fill="#52627a">Serving remains available when training or release services are unavailable.</text>
<rect x="36.0" y="112" width="354.6666666666667" height="250" rx="14" fill="white" stroke="#d7e0ec"/>
<rect x="36.0" y="112" width="354.6666666666667" height="6" rx="3" fill="#2563eb"/>
<text x="56.0" y="150" font-size="13" font-weight="700" fill="#2563eb">ONLINE PLANE</text>
<text x="56.0" y="186" font-size="21" font-weight="700" fill="#15283f">Online serving</text>
<text x="56.0" y="222" font-size="16" fill="#40536b">Serving revision + requests</text>
<text x="56.0" y="250" font-size="16" fill="#40536b">Responses, traces, feedback</text>
<text x="56.0" y="278" font-size="16" fill="#40536b">Independent runtime storage</text>
<path d="M393.6666666666667 248 H417.6666666666667" fill="none" stroke="#52627a" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="422.6666666666667" y="112" width="354.6666666666667" height="250" rx="14" fill="white" stroke="#d7e0ec"/>
<rect x="422.6666666666667" y="112" width="354.6666666666667" height="6" rx="3" fill="#087e8b"/>
<text x="442.6666666666667" y="150" font-size="13" font-weight="700" fill="#087e8b">OFFLINE PLANE</text>
<text x="442.6666666666667" y="186" font-size="21" font-weight="700" fill="#15283f">Offline training</text>
<text x="442.6666666666667" y="222" font-size="16" fill="#40536b">Data pipeline → dataset</text>
<text x="442.6666666666667" y="250" font-size="16" fill="#40536b">Control plane → training job</text>
<text x="442.6666666666667" y="278" font-size="16" fill="#40536b">TRL / Megatron → artifact</text>
<path d="M780.3333333333334 248 H804.3333333333334" fill="none" stroke="#52627a" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="809.3333333333334" y="112" width="354.6666666666667" height="250" rx="14" fill="white" stroke="#d7e0ec"/>
<rect x="809.3333333333334" y="112" width="354.6666666666667" height="6" rx="3" fill="#7952b3"/>
<text x="829.3333333333334" y="150" font-size="13" font-weight="700" fill="#7952b3">RELEASE PLANE</text>
<text x="829.3333333333334" y="186" font-size="21" font-weight="700" fill="#15283f">Registry and release</text>
<text x="829.3333333333334" y="222" font-size="16" fill="#40536b">Registry ↔ evaluation</text>
<text x="829.3333333333334" y="250" font-size="16" fill="#40536b">Evidence → promotion gate</text>
<text x="829.3333333333334" y="278" font-size="16" fill="#40536b">Deployment controller</text>
<text x="342" y="234" font-size="12" fill="#52627a">events</text>
<text x="733" y="234" font-size="12" fill="#52627a">files</text>
<path d="M 1030 330 V 380 H 204 V 337" fill="none" stroke="#52627a" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<rect x="460" y="368" width="288" height="23" fill="#f4f7fb"/>
<text x="478" y="384" font-size="14" fill="#52627a">Deploy approved serving revision</text>
<text x="36" y="409" font-size="16" fill="#40536b">Observability links all planes through request, run, candidate and serving identities.</text>
</g></svg>
