<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Profiling architecture: metrics and files</title><desc id="desc">Solid arrows: metric/query flow. Dashed arrows: files for offline analysis. Boxes identify deployment ownership.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#47647d"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#20354b}.title{font-size:27px;font-weight:700}.heading{font-size:19px;font-weight:700}.body{font-size:16px}.small{font-size:14px}</style>
<rect width="1200" height="100%" fill="#ffffff"/>
<text x="36" y="44" class="title">Profiling architecture: metrics and files</text>
<text x="36" y="74" class="small">Solid arrows: metric/query flow. Dashed arrows: files for offline analysis. Boxes identify deployment ownership.</text>
<rect x="36" y="112" width="430" height="190" rx="12" fill="#eef4fb" stroke="#8194a8" stroke-width="1.5"/>
<text x="56" y="144" class="heading">Compute nodes: spark1 / spark2</text>
<text x="56" y="175" class="body">Run DDP, Megatron or verl on these nodes.</text>
<text x="56" y="200" class="body">Node Exporter :9100 — CPU, memory, disk, NIC</text>
<text x="56" y="225" class="body">DCGM Exporter :9400 — GPU counters</text>
<text x="56" y="250" class="body">Deploy exporters separately on each node.</text>
<rect x="36" y="326" width="430" height="160" rx="12" fill="#fff6e7" stroke="#8194a8" stroke-width="1.5"/>
<text x="56" y="358" class="heading">Application integration</text>
<text x="56" y="389" class="body">Megatron hook -&gt; rank .prom -&gt; Node Exporter</text>
<text x="56" y="414" class="body">Ray / verl endpoints -&gt; application targets</text>
<text x="56" y="439" class="body">Requires logging hooks or framework setup.</text>
<rect x="710" y="112" width="450" height="190" rx="12" fill="#eef8f0" stroke="#8194a8" stroke-width="1.5"/>
<text x="730" y="144" class="heading">Monitoring host: provided Compose</text>
<text x="730" y="175" class="body">Prometheus :9090 scrapes endpoints every 5s.</text>
<text x="730" y="200" class="body">Grafana :3000 queries Prometheus.</text>
<text x="730" y="225" class="body">Provided dashboard: host / GPU resources</text>
<text x="730" y="250" class="body">Application targets start empty.</text>
<path d="M466 195 H710" fill="none" stroke="#47647d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="498" y="177" class="small">metric response</text>
<text x="498" y="223" class="small">Prometheus pulls</text>
<path d="M466 389 H630 V270 H710" fill="none" stroke="#47647d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="488" y="369" class="small">configured metrics</text>
<rect x="36" y="520" width="430" height="158" rx="12" fill="#fff6e7" stroke="#8194a8" stroke-width="1.5"/>
<text x="56" y="552" class="heading">Files written by the run</text>
<text x="56" y="583" class="body">Selected ranks: rank-N/trace-0.json</text>
<text x="56" y="608" class="body">NCCL: all-reduce.log + manifest.env</text>
<text x="56" y="633" class="body">fio: checkpoint.json</text>
<rect x="710" y="520" width="450" height="158" rx="12" fill="#fff6e7" stroke="#8194a8" stroke-width="1.5"/>
<text x="730" y="552" class="heading">Offline analysis: separately prepared</text>
<text x="730" y="583" class="body">Perfetto: individual Chrome trace</text>
<text x="730" y="608" class="body">HTA: explicit rank-to-file mapping</text>
<text x="730" y="633" class="body">Compare raw baselines with workload evidence.</text>
<path d="M466 590 H710" fill="none" stroke="#47647d" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/>
<text x="490" y="570" class="small">trace / baseline files</text>
<text x="710" y="349" class="heading">Not deployed by this Compose:</text>
<text x="710" y="377" class="body">OpenTelemetry / Tempo, role dashboards,</text>
<text x="710" y="402" class="body">canonical metric conversion and phase accounting.</text>
<text x="36" y="720" class="small">Join evidence using run ID, time window and rank map. Exporter labels do not isolate a process or attribute bytes to a phase.</text>
</svg>
