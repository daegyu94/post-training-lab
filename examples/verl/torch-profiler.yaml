global_profiler:
  tool: torch
  steps: [5]
  save_path: ./outputs/profile

actor_rollout_ref:
  actor:
    profiler:
      enable: true
      all_ranks: false
      ranks: [0]
      tool_config:
        torch:
          discrete: true
          contents: [cpu, cuda]
          schedule:
            skip_first: 1
            wait: 1
            warmup: 1
            active: 2
            repeat: 0
  rollout:
    profiler:
      enable: true
      all_ranks: false
      ranks: [0]
      tool_config:
        torch:
          discrete: true
          profile_token_start: 12
          profile_token_end: 46
